<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Sudoku</h1>
    <button id="theme-toggle" class="icon-button" aria-label="Toggle dark mode" type="button">🌙</button>
  </header>

  <main class="game-layout">
    <section class="controls-panel">
      <div class="control-group">
        <label for="difficulty-select">Difficulty:</label>
        <select id="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <button id="new-game" class="primary-button" type="button">New Game</button>

      <div id="timer" class="timer" aria-live="polite">Time: 0:00</div>
    </section>

    <section class="board-panel">
      <div id="sudoku-board" role="grid" aria-label="Sudoku board"></div>

      <div class="action-buttons">
        <button id="check-solution" class="secondary-button" type="button">Check</button>
        <button id="hint-button" class="secondary-button" type="button">Hint</button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div id="hints-used" class="hints-used"></div>
    </section>
  </main>

  <section class="leaderboard-panel">
    <h2>Top 10 Fastest Times</h2>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Time</th>
          <th>Level</th>
          <th>Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr id="leaderboard-empty-row">
          <td colspan="5">No scores yet — finish a puzzle to be the first!</td>
        </tr>
      </tbody>
    </table>
  </section>

  <div id="completion-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="completion-title">
    <div class="modal-content">
      <h2 id="completion-title">🎉 Solved!</h2>
      <p id="completion-summary"></p>
      <label for="player-name-input">Enter your name for the leaderboard:</label>
      <input id="player-name-input" type="text" maxlength="20" placeholder="Your name">
      <button id="save-score" class="primary-button" type="button">Save Score</button>
      <button id="close-modal" class="secondary-button" type="button">Close</button>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
